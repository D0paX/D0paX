name: Generate Metrics

# Renders a detailed metrics SVG (lowlighter/metrics) and commits it to
# assets/metrics.svg, which the README embeds. All figures are pulled live from
# the GitHub API at render time — nothing is hardcoded.
#
# Runs with zero setup: falls back to the built-in GITHUB_TOKEN, which is enough
# for the public plugins configured below (header, activity, community,
# repositories). For richer data — private-contribution counts, followers, the
# isocalendar — add an optional repository secret METRICS_TOKEN (classic PAT,
# scopes: repo, read:user, read:org) and it is used automatically when present.

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Render metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_order: base.header, base.activity, base.community, base.repositories, languages

          # Language breakdown — replaces the external top-langs card in the README.
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Themed to match the hero banner palette.
          config_colors: "background=0D1117"
          # include private-repo contribution counts (needs token scope)
          repositories_affiliations: owner, collaborator, organization_member
